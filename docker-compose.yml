version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: fake-call-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fake-call-app
    volumes:
      - mongodb_data:/data/db
    networks:
      - fake-call-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:latest
    container_name: fake-call-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fake-call-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fake-call-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/fake-call-app
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - fake-call-network
    restart: unless-stopped
    command: npm run dev

volumes:
  mongodb_data:
  redis_data:

networks:
  fake-call-network:
    driver: bridge
